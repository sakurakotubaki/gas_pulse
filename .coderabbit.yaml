# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ja-JP"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  path_filters:
    - "!app/android/**"
    - "!app/ios/**"
    - "!app/linux/**"
    - "!app/macos/**"
    - "!app/windows/**"
    - "!app/lib/**/*.freezed.dart"
    - "!app/lib/**/*.g.dart"
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - "develop"

chat:
  auto_reply: true
